<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Te cambio figuritas</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e3e3e7;
    --text: #1b1b1f;
    --muted: #6b7280;
    --accent: #2b6cb0;
    --accent-hover: #245b97;
    --code-bg: #f3f4f6;
    --ok: #047857;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131418;
      --panel: #1c1d22;
      --border: #2c2e36;
      --text: #ececef;
      --muted: #9aa0aa;
      --accent: #5aa0e8;
      --accent-hover: #75b3f0;
      --code-bg: #242630;
      --ok: #34d399;
      --warn: #f59e0b;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }

  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

  .help {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .help strong { color: var(--text); }

  .inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 720px) {
    .inputs { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .panel-head label {
    font-size: 13px;
    font-weight: 600;
  }
  .paste-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
  }
  .paste-btn:hover { color: var(--accent); border-color: var(--accent); }
  .paste-btn.pasted { color: var(--ok); border-color: var(--ok); }

  textarea {
    width: 100%;
    min-height: 280px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  .actions { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
  button.primary {
    background: var(--accent);
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button.ghost:hover { color: var(--text); border-color: var(--accent); }

  .results { display: grid; gap: 16px; }
  .result-block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .result-title { font-weight: 600; font-size: 14px; }
  .result-meta { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .copy-btn.copied { color: var(--ok); border-color: var(--ok); }

  pre.result-body {
    margin: 0;
    padding: 12px;
    background: var(--code-bg);
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 480px;
    overflow: auto;
  }
  pre.empty { color: var(--muted); font-style: italic; }

  .notice {
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    background: var(--code-bg);
    color: var(--warn);
    margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Te cambio figuritas</h1>
    <p>Compara dos listas exportadas desde <code>figuritas.app</code> y obten las coincidencias en formato pegable.</p>
  </header>

  <div class="help">
    En <strong>Tengo</strong> pega lo que tienes (tus repetidas). En <strong>Falta</strong> pega lo que busca la otra persona. Obtienes <strong>las que te interesan</strong> — láminas que tú tienes y la otra persona necesita.
  </div>

  <div class="inputs">
    <div class="panel">
      <div class="panel-head">
        <label for="input-a">Tengo</label>
        <button class="paste-btn" type="button" data-target="input-a">Pegar</button>
      </div>
      <textarea id="input-a" spellcheck="false" placeholder="Pega lo que tienes (ej. tus repetidas)..."></textarea>
    </div>
    <div class="panel">
      <div class="panel-head">
        <label for="input-b">Falta</label>
        <button class="paste-btn" type="button" data-target="input-b">Pegar</button>
      </div>
      <textarea id="input-b" spellcheck="false" placeholder="Pega lo que la otra persona necesita (sus faltantes)..."></textarea>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="btn-compare">Comparar</button>
    <button class="ghost" id="btn-clear">Limpiar</button>
    <button class="ghost" id="btn-example">Cargar ejemplo</button>
  </div>

  <div id="notice" class="notice" hidden></div>

  <div id="results" class="results"></div>
</div>

<script>
"use strict";

// ---------- parsing ----------

function normalize(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}

function detectSection(line) {
  const n = normalize(line);
  if (n === 'me faltan' || n === 'faltan' || n === 'faltantes') return 'missing';
  if (n === 'repetidas' || n === 'repes' || n === 'repe') return 'duplicates';
  return null;
}

const LINE_RE = /^([A-Z]{2,4})\s*(.*?)\s*:\s*(.+)$/;

function addEntry(map, code, emoji, nums) {
  let entry = map.get(code);
  if (!entry) {
    entry = { emoji: emoji || '', nums: new Set() };
    map.set(code, entry);
  }
  if (!entry.emoji && emoji) entry.emoji = emoji;
  for (const n of nums) entry.nums.add(n);
}

function parseList(text) {
  const all = new Map();
  const lines = text.split(/\r?\n/);
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (detectSection(line)) continue;
    const m = line.match(LINE_RE);
    if (!m) continue;
    const [, code, emojiRaw, numsRaw] = m;
    const emoji = emojiRaw.trim();
    const nums = numsRaw.split(',').map(s => s.trim()).filter(s => /^\d+$/.test(s)).map(Number);
    if (!nums.length) continue;
    addEntry(all, code, emoji, nums);
  }
  return all;
}

// ---------- intersection ----------

function intersect(mapA, mapB) {
  const out = new Map();
  for (const [code, a] of mapA) {
    const b = mapB.get(code);
    if (!b) continue;
    const common = new Set();
    for (const n of a.nums) if (b.nums.has(n)) common.add(n);
    if (!common.size) continue;
    out.set(code, { emoji: a.emoji || b.emoji, nums: common });
  }
  return out;
}

function totalCount(map) {
  let t = 0;
  for (const { nums } of map.values()) t += nums.size;
  return t;
}

function formatMap(map) {
  if (!map.size) return '';
  const codes = [...map.keys()].sort();
  return codes.map(code => {
    const { emoji, nums } = map.get(code);
    const sorted = [...nums].sort((a, b) => a - b);
    return `${code}${emoji ? ' ' + emoji : ''}: ${sorted.join(', ')}`;
  }).join('\n');
}

// ---------- UI ----------

const inputA = document.getElementById('input-a');
const inputB = document.getElementById('input-b');
const notice = document.getElementById('notice');
const results = document.getElementById('results');

function showNotice(msg) {
  notice.textContent = msg;
  notice.hidden = false;
}

function clearAll() {
  results.replaceChildren();
  notice.hidden = true;
  notice.textContent = '';
}

function renderResultBlock({ title, meta, body }) {
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.type = 'button';
  copyBtn.textContent = 'Copiar';
  if (!body) copyBtn.disabled = true;
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(body);
      copyBtn.textContent = 'Copiado';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'Copiar'; copyBtn.classList.remove('copied'); }, 1400);
    } catch {
      copyBtn.textContent = 'Error';
      setTimeout(() => { copyBtn.textContent = 'Copiar'; }, 1400);
    }
  });

  const titleEl = document.createElement('span');
  titleEl.className = 'result-title';
  titleEl.textContent = title;

  const left = document.createElement('div');
  left.appendChild(titleEl);
  if (meta) {
    const metaEl = document.createElement('span');
    metaEl.className = 'result-meta';
    metaEl.textContent = meta;
    left.appendChild(metaEl);
  }

  const head = document.createElement('div');
  head.className = 'result-head';
  head.appendChild(left);
  head.appendChild(copyBtn);

  const pre = document.createElement('pre');
  pre.className = 'result-body' + (body ? '' : ' empty');
  pre.textContent = body || '(sin coincidencias)';

  const block = document.createElement('div');
  block.className = 'result-block';
  block.appendChild(head);
  block.appendChild(pre);
  results.appendChild(block);
}

function run() {
  clearAll();
  const a = parseList(inputA.value);
  const b = parseList(inputB.value);
  if (!a.size) { showNotice('No se pudo parsear ninguna línea de "Tengo".'); return; }
  if (!b.size) { showNotice('No se pudo parsear ninguna línea de "Falta".'); return; }
  const common = intersect(a, b);
  renderResultBlock({
    title: 'Las que te interesan',
    meta: `${totalCount(common)} láminas · ${common.size} países`,
    body: formatMap(common),
  });
}

// ---------- paste buttons ----------

for (const btn of document.querySelectorAll('.paste-btn')) {
  btn.addEventListener('click', async () => {
    const target = document.getElementById(btn.dataset.target);
    try {
      const text = await navigator.clipboard.readText();
      target.value = text;
      btn.textContent = 'Pegado';
      btn.classList.add('pasted');
      setTimeout(() => { btn.textContent = 'Pegar'; btn.classList.remove('pasted'); }, 1200);
    } catch {
      btn.textContent = 'Sin permiso';
      setTimeout(() => { btn.textContent = 'Pegar'; }, 1400);
    }
  });
}

// ---------- example data ----------

const EXAMPLE_TENGO = `FWC 📜: 9, 10, 13, 14, 19
MEX 🇲🇽: 6, 11, 16, 20
KOR 🇰🇷: 8, 10, 12, 14, 15, 17, 18
ARG 🇦🇷: 2, 7, 13
BRA 🇧🇷: 8, 9, 12, 14, 17, 18`;

const EXAMPLE_FALTA = `FWC 🏆: 9, 13
MEX 🇲🇽: 6, 11
KOR 🇰🇷: 8, 12, 18
ARG 🇦🇷: 2, 7, 13
BRA 🇧🇷: 8, 9`;

// ---------- wiring ----------

document.getElementById('btn-compare').addEventListener('click', run);
document.getElementById('btn-clear').addEventListener('click', () => {
  inputA.value = '';
  inputB.value = '';
  clearAll();
});
document.getElementById('btn-example').addEventListener('click', () => {
  inputA.value = EXAMPLE_TENGO;
  inputB.value = EXAMPLE_FALTA;
  clearAll();
});
</script>
</body>
</html>
